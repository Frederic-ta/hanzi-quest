<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1520">
  <title>HanziQuest — Apprends le Chinois</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Level Up Overlay -->
  <div id="level-up-overlay">
    <div class="level-up-content">
      <div class="level-up-text">Niveau supérieur !</div>
      <div class="level-number">2</div>
      <div class="level-title">Apprenti</div>
    </div>
    <div class="particles-container"></div>
  </div>

  <!-- NPC Dialogue Overlay -->
  <div id="npc-overlay" class="npc-overlay">
    <div class="npc-dialogue-box">
      <div class="npc-header">
        <span class="npc-icon" id="npc-icon"></span>
        <div class="npc-info">
          <div class="npc-name" id="npc-name"></div>
          <div class="npc-role" id="npc-role"></div>
        </div>
      </div>
      <div class="npc-text" id="npc-text"></div>
      <button class="btn-rpg npc-next-btn" id="npc-next-btn" onclick="App.advanceNPCDialogue()">Suivant</button>
    </div>
  </div>

  <!-- Screens -->
  <div id="screen-home" class="screen active"></div>
  <div id="screen-world" class="screen"></div>
  <div id="screen-combat" class="screen"></div>
  <div id="screen-learn" class="screen"></div>
  <div id="screen-quiz" class="screen"></div>
  <div id="screen-write" class="screen"></div>
  <div id="screen-skills" class="screen"></div>
  <div id="screen-profile" class="screen"></div>
  <div id="screen-review" class="screen"></div>
  <div id="screen-recap" class="screen"></div>
  <div id="screen-word-detail" class="screen"></div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="home">
      <span class="nav-icon">🏠</span>
      <span>Accueil</span>
    </button>
    <button class="nav-btn" data-screen="world">
      <span class="nav-icon">🗺️</span>
      <span>Monde</span>
    </button>
    <button class="nav-btn" data-screen="quiz">
      <span class="nav-icon">⚔️</span>
      <span>Quiz</span>
    </button>
    <button class="nav-btn" data-screen="skills">
      <span class="nav-icon">🌳</span>
      <span>Skills</span>
    </button>
    <button class="nav-btn" data-screen="profile">
      <span class="nav-icon">👤</span>
      <span>Profil</span>
    </button>
  </nav>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/rpg.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/writing.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/world.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/skilltree.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
